services:
  eink:
    build: ./server
    container_name: eink
    restart: unless-stopped
    ports:
      - "8000:8000"   # o proxy inverso / túnel aponta para aqui
    environment:
      UI_USER: ${UI_USER:-admin}
      UI_PASSWORD: ${UI_PASSWORD:?defina UI_PASSWORD no ficheiro .env}
      DEVICE_TOKEN: ${DEVICE_TOKEN:?defina DEVICE_TOKEN no ficheiro .env}
      TZ: Europe/Lisbon
    volumes:
      - ./data:/data
