# Servidor Linux com Docker e Caddy já instalados (o mesmo padrão do site do agrupamento e do Helpdesk).
# O contentor só fica acessível em 127.0.0.1:PORTA; o Caddy do servidor encaminha o domínio para aí (ver Caddyfile.exemplo).
#
# Arranque:   docker compose up -d --build        Registos:  docker compose logs -f eink
# Atualizar:  ./deploy.sh
# Os dados (base de dados SQLite, cópias de segurança e segredo das sessões) ficam em ./data, fora do contentor.

services:
  eink:
    build: .
    container_name: eink
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${PORTA:-8093}:3000"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
